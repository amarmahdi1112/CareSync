name: CareSync CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caresync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
    services:
      postgres-runtime:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "55435:5432"
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-disposable:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "55436:5432"
          - "56554:5432"
          - "56555:5432"
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the production origin
        run: |
          python3 - "${PRODUCTION_ORIGIN}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          value = sys.argv[1]
          parsed = urlsplit(value)
          if (
              value != value.strip()
              or any(character.isspace() for character in value)
              or parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
              or parsed.path not in {"", "/"}
          ):
              raise SystemExit(
                  "::error::PRODUCTION_ORIGIN must be an absolute HTTPS origin "
                  "without credentials, a path, query, or fragment"
              )
          try:
              parsed.port
          except ValueError as error:
              raise SystemExit(f"::error::PRODUCTION_ORIGIN has an invalid port: {error}")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install the pinned uv release
        run: python -m pip install --disable-pip-version-check uv==0.9.27

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Resolve the server OCR compatibility set
        run: |
          python -m pip install \
            --dry-run \
            --ignore-installed \
            --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux2014_x86_64 \
            --platform manylinux1_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312 \
            --require-hashes \
            --requirement backend/scripts/ocr-requirements-linux-x86_64-cp312.lock \
            >/dev/null

      - name: Install the pinned PostgreSQL 17 client
        run: |
          readonly key_path="${RUNNER_TEMP}/postgresql-pgdg.asc"
          readonly keyring_path="${RUNNER_TEMP}/postgresql-pgdg.gpg"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "${key_path}"
          printf '%s  %s\n' \
            '0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76' \
            "${key_path}" \
            | sha256sum --check --strict
          gpg --batch --dearmor < "${key_path}" > "${keyring_path}"
          sudo install \
            -D \
            -m 0644 \
            "${keyring_path}" \
            /usr/share/keyrings/postgresql-pgdg.gpg
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list >/dev/null
          sudo apt-get update --quiet
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --assume-yes \
            --no-install-recommends \
            postgresql-client-17=17.10-1.pgdg24.04+1
          /usr/lib/postgresql/17/bin/psql --version \
            | grep -Eq '^psql \(PostgreSQL\) 17\.10 '

          # One frozen billing-policy proof predates the portable CARESYNC_POSTGRES_BIN
          # override. Supply its reviewed path without weakening that proof.
          sudo install -d -m 0755 /opt/homebrew/opt/postgresql@17/bin
          sudo ln -s \
            /usr/lib/postgresql/17/bin/pg_dump \
            /opt/homebrew/opt/postgresql@17/bin/pg_dump
          sudo ln -s \
            /usr/lib/postgresql/17/bin/pg_restore \
            /opt/homebrew/opt/postgresql@17/bin/pg_restore

      - name: Lint the backend
        working-directory: backend
        run: uv run ruff check .

      - name: Test the backend
        working-directory: backend
        run: uv run pytest

      - name: Certify the PostgreSQL 17 production path
        working-directory: backend
        env:
          BASIC_POSTGRES_TEST_HOST: 127.0.0.1
          CARESYNC_POSTGRES_BIN: /usr/lib/postgresql/17/bin
          CARESYNC_PSQL: /usr/lib/postgresql/17/bin/psql
        run: |
          readonly runtime_port=55435
          readonly disposable_port=55436
          readonly postgres_admin_url="postgresql+psycopg://postgres@127.0.0.1:${disposable_port}/postgres"
          readonly admissions_admin_url="postgresql+psycopg://postgres@127.0.0.1:56554/postgres"
          readonly room_safety_admin_url="postgresql+psycopg://postgres@127.0.0.1:56555/postgres"
          readonly psql=/usr/lib/postgresql/17/bin/psql
          readonly createdb=/usr/lib/postgresql/17/bin/createdb
          readonly dropdb=/usr/lib/postgresql/17/bin/dropdb

          for port in "${runtime_port}" "${disposable_port}"; do
            /usr/lib/postgresql/17/bin/pg_isready \
              --host=127.0.0.1 \
              --port="${port}" \
              --username=postgres \
              --dbname=postgres
            server_major="$(
              "${psql}" \
                --no-psqlrc \
                --tuples-only \
                --no-align \
                --host=127.0.0.1 \
                --port="${port}" \
                --username=postgres \
                --dbname=postgres \
                --command="SELECT current_setting('server_version_num')::integer / 10000"
            )"
            [[ "${server_major}" == "17" ]] || {
              printf '::error::PostgreSQL service on port %s is not major version 17\n' \
                "${port}" >&2
              exit 1
            }
          done

          # These proofs each create and remove their own database and roles on
          # the otherwise-empty disposable cluster.
          BASIC_POSTGRES_BILLING_SCOPE_TEST_URL="${postgres_admin_url}" \
          BASIC_POSTGRES_BILLING_POLICY_0042_TEST_URL="${postgres_admin_url}" \
          BASIC_POSTGRES_ADMISSIONS_TEST_URL="${admissions_admin_url}" \
          BASIC_POSTGRES_BILLING_LEDGER_TEST_URL="${postgres_admin_url}" \
          BASIC_POSTGRES_DRIVER_REGISTRY_TEST_URL="${postgres_admin_url}" \
          BASIC_POSTGRES_ORG_WIDE_ROOM_PRESENCE_0043_TEST_URL="${room_safety_admin_url}" \
          BASIC_POSTGRES_ROOM_SAFETY_0041_TEST_URL="${room_safety_admin_url}" \
          BASIC_POSTGRES_TRANSPORT_COMMANDS_TEST_URL="${postgres_admin_url}" \
          BASIC_POSTGRES_PUBLIC_JOB_OUTBOX_TEST_URL="${postgres_admin_url}" \
            uv run pytest \
              tests/test_basic_billing_agreement_scope_migration.py::test_postgres_fresh_chain_reproduces_0036_then_applies_0037_scope \
              tests/test_basic_billing_policy_recertification_migration.py::test_postgres_17_recertification_tamper_downgrade_and_dump_restore \
              tests/test_basic_postgres_admissions_decision_spine.py \
              tests/test_basic_postgres_billing_ledger.py \
              tests/test_basic_postgres_driver_vehicle_registry.py \
              tests/test_basic_postgres_org_wide_room_presence_0043.py \
              tests/test_basic_postgres_room_safety_0041.py \
              tests/test_basic_postgres_transport_registry_commands.py \
              tests/test_basic_postgres_transport_downstream_attestation.py \
              tests/test_basic_public_job_catalog_outbox.py::test_postgres_outbox_is_globally_readable_but_runtime_immutable \
              tests/test_basic_public_job_catalog_outbox.py::test_postgres_restricted_owner_backfill_and_runtime_trigger_behavior

          # This migration test deliberately requires that no caresync database
          # exist on its isolated cluster before it begins.
          BASIC_POSTGRES_MIGRATION_TEST_PORT="${disposable_port}" \
            uv run pytest \
              tests/test_basic_postgres_childcare_command_spine_migration_gate.py

          # Frozen authority, release, and screening proofs assert exact historical
          # Alembic revisions. Give every revision a fresh database and fresh
          # cluster roles, apply the capability-gated runtime bootstrap, and run
          # only nodes that remain compatible with that exact schema.
          prepare_frozen_revision() {
            local revision="$1"
            "${dropdb}" \
              --if-exists \
              --force \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              caresync
            "${psql}" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              --dbname=postgres <<'SQL'
          DROP ROLE IF EXISTS caresync_basic_app;
          DROP ROLE IF EXISTS migration_owner;
          CREATE ROLE migration_owner
            LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION BYPASSRLS;
          CREATE ROLE caresync_basic_app
            LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION NOBYPASSRLS;
          SQL
            "${createdb}" \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              --owner=migration_owner \
              caresync
            ENVIRONMENT=test \
            DATABASE_TYPE=postgres \
            DATABASE_HOST=127.0.0.1 \
            DATABASE_PORT="${disposable_port}" \
            DATABASE_USER=migration_owner \
            DATABASE_PASSWORD='' \
            DATABASE_NAME=caresync \
            DATABASE_SSL=false \
            DATABASE_READ_ONLY=false \
              uv run alembic upgrade "${revision}"
            observed_revision="$(
              "${psql}" \
                --no-psqlrc \
                --tuples-only \
                --no-align \
                --host=127.0.0.1 \
                --port="${disposable_port}" \
                --username=postgres \
                --dbname=caresync \
                --command='SELECT version_num FROM public.alembic_version'
            )"
            [[ "${observed_revision}" == "${revision}" ]] || {
              printf \
                '::error::Expected frozen revision %s, found %s\n' \
                "${revision}" \
                "${observed_revision}" >&2
              exit 1
            }
            "${psql}" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              --dbname=caresync \
              --file=scripts/bootstrap_basic_runtime_role.sql
          }

          cleanup_frozen_revision() {
            "${dropdb}" \
              --if-exists \
              --force \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              caresync
            "${psql}" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --host=127.0.0.1 \
              --port="${disposable_port}" \
              --username=postgres \
              --dbname=postgres \
              --command='DROP ROLE IF EXISTS caresync_basic_app; DROP ROLE IF EXISTS migration_owner'
          }

          prepare_frozen_revision 0029A_family_authority_kernel
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
            uv run pytest tests/test_basic_postgres_family_authority_kernel.py
          cleanup_frozen_revision

          prepare_frozen_revision 0029A1_family_evidence_vault
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
            uv run pytest \
              tests/test_basic_postgres_family_evidence_vault.py \
              tests/test_basic_postgres_family_authority_api.py
          cleanup_frozen_revision

          prepare_frozen_revision 0029A2_authority_activation
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
            uv run pytest \
              tests/test_basic_postgres_family_authority_activation.py \
              tests/test_basic_postgres_family_authority_workspace_activation.py
          cleanup_frozen_revision

          prepare_frozen_revision 0029B_release_context
          # Exclude test_z_postgres_exact_a2_roundtrip: its final Alembic check
          # asks whether frozen B is the source-tree head, which is no longer true.
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
            uv run pytest \
              tests/test_basic_postgres_family_release_context.py::test_release_context_catalog_boundary_is_exact \
              tests/test_basic_postgres_family_release_context.py::test_release_context_detector_accepts_complete_and_rejects_missing_execute \
              tests/test_basic_postgres_family_release_context.py::test_runtime_projection_is_gated_minimum_and_direct_a2_reads_stay_closed \
              tests/test_basic_postgres_family_release_context.py::test_security_definer_projection_rejects_every_operational_gate_failure \
              tests/test_basic_postgres_family_release_context.py::test_postgres_revision_change_emits_one_exact_generic_event \
              tests/test_basic_postgres_family_release_context.py::test_nonoverlapping_shift_and_attendance_states_never_compose_context
          cleanup_frozen_revision

          prepare_frozen_revision 0029D_release_checkout_writer
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
            uv run pytest tests/test_basic_postgres_release_checkout_writer.py
          cleanup_frozen_revision

          prepare_frozen_revision 0030_staff_screening_paths
          BASIC_POSTGRES_TEST_PORT="${disposable_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
          BASIC_POSTGRES_TEST_ADMIN_USER=postgres \
            uv run pytest tests/test_basic_postgres_staff_screening_pathways.py
          cleanup_frozen_revision

          # Build the same owner/runtime-role topology used by production.
          "${psql}" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port="${runtime_port}" \
            --username=postgres \
            --dbname=postgres <<'SQL'
          DROP DATABASE IF EXISTS caresync;
          DROP ROLE IF EXISTS migration_owner;
          CREATE ROLE migration_owner
            LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
            NOREPLICATION BYPASSRLS;
          CREATE DATABASE caresync OWNER migration_owner;
          SQL
          "${psql}" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port="${runtime_port}" \
            --username=postgres \
            --dbname=caresync \
            --command='ALTER SCHEMA public OWNER TO migration_owner'

          ENVIRONMENT=test \
          DATABASE_TYPE=postgres \
          DATABASE_HOST=127.0.0.1 \
          DATABASE_PORT="${runtime_port}" \
          DATABASE_USER=migration_owner \
          DATABASE_PASSWORD='' \
          DATABASE_NAME=caresync \
          DATABASE_SSL=false \
          DATABASE_READ_ONLY=false \
            uv run alembic upgrade head
          ENVIRONMENT=test \
          DATABASE_TYPE=postgres \
          DATABASE_HOST=127.0.0.1 \
          DATABASE_PORT="${runtime_port}" \
          DATABASE_USER=migration_owner \
          DATABASE_PASSWORD='' \
          DATABASE_NAME=caresync \
          DATABASE_SSL=false \
          DATABASE_READ_ONLY=false \
            uv run alembic check
          "${psql}" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port="${runtime_port}" \
            --username=postgres \
            --dbname=caresync \
            --file=scripts/bootstrap_basic_runtime_role.sql

          # Certify adversarial role drift on its own. This suite deliberately
          # changes cluster roles, schema ACLs, and repository function grants.
          BASIC_POSTGRES_TEST_PORT="${runtime_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
          BASIC_POSTGRES_TEST_ADMIN_USER=postgres \
          BASIC_POSTGRES_TEST_MIGRATION_USER=migration_owner \
            uv run pytest tests/test_basic_postgres_runtime_role_hardening.py
          "${psql}" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port="${runtime_port}" \
            --username=postgres \
            --dbname=caresync \
            --file=scripts/bootstrap_basic_runtime_role.sql

          # These are current-head behavior proofs. Frozen 0029A-0030 catalog
          # suites assert their historical Alembic revisions and must never be
          # pointed at the 0043 production schema.
          BASIC_POSTGRES_TEST_PORT="${runtime_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
          BASIC_POSTGRES_TEST_ADMIN_USER=postgres \
          BASIC_POSTGRES_TEST_MIGRATION_USER=migration_owner \
            uv run pytest \
              tests/test_basic_postgres_care_attendance_concurrency.py \
              tests/test_basic_postgres_enrollment_attendance_concurrency.py \
              tests/test_basic_postgres_push_rls.py \
              tests/test_basic_postgres_regulated_care_concurrency.py \
              tests/test_basic_postgres_rls.py \
              tests/test_basic_postgres_room_deactivation_attendance_concurrency.py \
              tests/test_basic_postgres_room_placement_concurrency.py \
              tests/test_basic_postgres_staff_exchange.py \
              tests/test_basic_postgres_staff_rota.py \
              tests/test_basic_postgres_staff_screening_provisioning.py \
              tests/test_basic_postgres_staff_workforce.py

          # The childcare spine exercises temporary ACL drift. Run it last,
          # restore the terminal grants, then prove restricted-role startup.
          BASIC_POSTGRES_TEST_PORT="${runtime_port}" \
          BASIC_POSTGRES_TEST_DATABASE=caresync \
          BASIC_POSTGRES_TEST_ADMIN_USER=postgres \
          BASIC_POSTGRES_TEST_MIGRATION_USER=migration_owner \
            uv run pytest tests/test_basic_postgres_childcare_command_spine.py
          "${psql}" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port="${runtime_port}" \
            --username=postgres \
            --dbname=caresync \
            --file=scripts/bootstrap_basic_runtime_role.sql
          ENVIRONMENT=test \
          DATABASE_TYPE=postgres \
          DATABASE_HOST=127.0.0.1 \
          DATABASE_PORT="${runtime_port}" \
          DATABASE_USER=caresync_basic_app \
          DATABASE_PASSWORD='' \
          DATABASE_NAME=caresync \
          DATABASE_SSL=false \
          DATABASE_READ_ONLY=false \
          JWT_SECRET=postgres-release-certificate-secret-32-bytes \
            uv run python - <<'PY'
          from fastapi.testclient import TestClient

          from app.core.config import get_settings
          from app.db.session import Database
          from app.main import create_app

          settings = get_settings()
          database = Database(settings)
          try:
              database.assert_basic_runtime_identity()
          finally:
              database.dispose()

          with TestClient(create_app(settings)) as client:
              response = client.get("/api/v1/health")
              assert response.status_code == 200, response.text
              assert response.json().get("status") == "ok", response.json()
          PY

          # Finish with an exact FORCE-RLS logical backup/restore proof using
          # two independent PostgreSQL 17 clusters.
          for port in "${runtime_port}" "${disposable_port}"; do
            "${dropdb}" \
              --if-exists \
              --force \
              --host=127.0.0.1 \
              --port="${port}" \
              --username=postgres \
              caresync
            "${createdb}" \
              --host=127.0.0.1 \
              --port="${port}" \
              --username=postgres \
              --owner=postgres \
              caresync
          done
          BASIC_POSTGRES_BACKUP_SOURCE_PORT="${runtime_port}" \
          BASIC_POSTGRES_BACKUP_TARGET_PORT="${disposable_port}" \
            uv run pytest tests/test_backup_restore_postgres.py

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend-redesign/package-lock.json
            frontend/package-lock.json
            browser-extension/package-lock.json

      - name: Install the redesigned frontend
        working-directory: frontend-redesign
        run: npm ci

      - name: Test the redesigned frontend
        working-directory: frontend-redesign
        run: npm test

      - name: Build the redesigned frontend for production
        working-directory: frontend-redesign
        run: VITE_API_URL="${PRODUCTION_ORIGIN%/}/api/v1" npm run build

      - name: Verify the legacy frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify the browser extension
        working-directory: browser-extension
        run: |
          npm ci
          npm test
          npm run build

      - name: Package the immutable release
        id: release
        run: |
          release_path="${RUNNER_TEMP}/caresync-${GITHUB_SHA}.tar.gz"
          deploy/scripts/build-release.sh "${release_path}" "${GITHUB_SHA}" \
            | tee "${RUNNER_TEMP}/release-build.txt"
          python3 deploy/scripts/validate-release-archive.py \
            "${release_path}" \
            "${GITHUB_SHA}"
          release_sha256="$(
            sed -n 's/^release_sha256=//p' "${RUNNER_TEMP}/release-build.txt"
          )"
          [[ "${release_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "${release_path}" | awk '{print $1}')" == "${release_sha256}" ]]
          printf 'path=%s\n' "${release_path}" >> "${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${release_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caresync-release-${{ github.sha }}
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy-production:
    name: Deploy production
    needs:
      - verify-and-package
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ORIGIN }}
    concurrency:
      group: caresync-production
      cancel-in-progress: false
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_USER: ${{ vars.PROD_USER }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}

    steps:
      - name: Download the verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: caresync-release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Configure the restricted deploy identity
        env:
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          [[ "${PROD_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || {
            printf '::error::PROD_HOST is missing or invalid\n' >&2
            exit 1
          }
          [[ "${PROD_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            printf '::error::PROD_USER is missing or invalid\n' >&2
            exit 1
          }
          [[ -n "${PROD_KNOWN_HOSTS}" ]] || {
            printf '::error::PROD_KNOWN_HOSTS is not configured\n' >&2
            exit 1
          }
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || {
            printf '::error::PROD_SSH_PRIVATE_KEY is not configured\n' >&2
            exit 1
          }

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PROD_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/caresync_deploy"
          chmod 600 "${HOME}/.ssh/known_hosts" "${HOME}/.ssh/caresync_deploy"
          ssh-keygen -y -f "${HOME}/.ssh/caresync_deploy" >/dev/null
          ssh-keygen -F "${PROD_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null || {
            printf '::error::PROD_KNOWN_HOSTS does not pin PROD_HOST\n' >&2
            exit 1
          }

      - name: Refuse a stale production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          readonly response="${RUNNER_TEMP}/main-tip.json"
          curl \
            --fail-with-body \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --output "${response}"
          current_main="$(
            python3 - "${response}" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              payload = json.load(source)
          value = (payload.get("object") or {}).get("sha")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("GitHub did not return a valid main branch tip")
          print(value)
          PY
          )"
          if [[ "${current_main}" != "${GITHUB_SHA}" ]]; then
            printf '%s\n' \
              "::error::Refusing stale production revision ${GITHUB_SHA}; current main is ${current_main}" \
              >&2
            exit 1
          fi

      - name: Stream the release to the forced deploy command
        run: |
          artifact="${RUNNER_TEMP}/release/caresync-${GITHUB_SHA}.tar.gz"
          [[ -f "${artifact}" ]]
          artifact_sha256="$(sha256sum "${artifact}" | awk '{print $1}')"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${artifact_sha256}" =~ ^[0-9a-f]{64}$ ]]

          ssh \
            -T \
            -i "${HOME}/.ssh/caresync_deploy" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${PROD_USER}@${PROD_HOST}" \
            "deploy ${GITHUB_SHA} ${artifact_sha256}" \
            < "${artifact}"

      - name: Verify the public production endpoints
        run: |
          health_url="${PRODUCTION_ORIGIN%/}/api/v1/health"
          health_json="$(curl \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --show-error \
            --silent \
            --max-time 15 \
            "${health_url}")"
          python3 - "${health_json}" <<'PY'
          import json
          import sys

          try:
              health = json.loads(sys.argv[1])
          except json.JSONDecodeError as error:
              raise SystemExit(f"production health returned invalid JSON: {error}") from error

          database = health.get("database") or {}
          if not (
              health.get("status") == "ok"
              and database.get("connected") is True
              and database.get("database_name") == "caresync"
          ):
              raise SystemExit("production health did not certify the CareSync database")
          PY

          frontend_html="$(curl \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --show-error \
            --silent \
            --max-time 15 \
            "${PRODUCTION_ORIGIN%/}/")"
          grep -Fq '<div id="root"></div>' <<< "${frontend_html}" || {
            printf '::error::production did not serve the CareSync application shell\n' >&2
            exit 1
          }

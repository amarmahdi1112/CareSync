name: CareSync CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caresync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the production origin
        run: |
          python3 - "${PRODUCTION_ORIGIN}" <<'PY'
          import sys
          from urllib.parse import urlsplit

          value = sys.argv[1]
          parsed = urlsplit(value)
          if (
              value != value.strip()
              or any(character.isspace() for character in value)
              or parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
              or parsed.path not in {"", "/"}
          ):
              raise SystemExit(
                  "::error::PRODUCTION_ORIGIN must be an absolute HTTPS origin "
                  "without credentials, a path, query, or fragment"
              )
          try:
              parsed.port
          except ValueError as error:
              raise SystemExit(f"::error::PRODUCTION_ORIGIN has an invalid port: {error}")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install the pinned uv release
        run: python -m pip install --disable-pip-version-check uv==0.9.27

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Lint the backend
        working-directory: backend
        run: uv run ruff check .

      - name: Test the backend
        working-directory: backend
        run: uv run pytest

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend-redesign/package-lock.json
            frontend/package-lock.json
            browser-extension/package-lock.json

      - name: Install the redesigned frontend
        working-directory: frontend-redesign
        run: npm ci

      - name: Test the redesigned frontend
        working-directory: frontend-redesign
        run: npm test

      - name: Build the redesigned frontend for production
        working-directory: frontend-redesign
        run: VITE_API_URL="${PRODUCTION_ORIGIN%/}/api/v1" npm run build

      - name: Verify the legacy frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify the browser extension
        working-directory: browser-extension
        run: |
          npm ci
          npm test
          npm run build

      - name: Package the immutable release
        id: release
        run: |
          release_path="${RUNNER_TEMP}/caresync-${GITHUB_SHA}.tar.gz"
          deploy/scripts/build-release.sh "${release_path}" "${GITHUB_SHA}" \
            | tee "${RUNNER_TEMP}/release-build.txt"
          python3 deploy/scripts/validate-release-archive.py \
            "${release_path}" \
            "${GITHUB_SHA}"
          release_sha256="$(
            sed -n 's/^release_sha256=//p' "${RUNNER_TEMP}/release-build.txt"
          )"
          [[ "${release_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "${release_path}" | awk '{print $1}')" == "${release_sha256}" ]]
          printf 'path=%s\n' "${release_path}" >> "${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${release_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caresync-release-${{ github.sha }}
          path: ${{ steps.release.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy-production:
    name: Deploy production
    needs:
      - verify-and-package
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ORIGIN }}
    concurrency:
      group: caresync-production
      cancel-in-progress: false
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_USER: ${{ vars.PROD_USER }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}

    steps:
      - name: Download the verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: caresync-release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Configure the restricted deploy identity
        env:
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          [[ "${PROD_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || {
            printf '::error::PROD_HOST is missing or invalid\n' >&2
            exit 1
          }
          [[ "${PROD_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            printf '::error::PROD_USER is missing or invalid\n' >&2
            exit 1
          }
          [[ -n "${PROD_KNOWN_HOSTS}" ]] || {
            printf '::error::PROD_KNOWN_HOSTS is not configured\n' >&2
            exit 1
          }
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || {
            printf '::error::PROD_SSH_PRIVATE_KEY is not configured\n' >&2
            exit 1
          }

          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${PROD_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/caresync_deploy"
          chmod 600 "${HOME}/.ssh/known_hosts" "${HOME}/.ssh/caresync_deploy"
          ssh-keygen -y -f "${HOME}/.ssh/caresync_deploy" >/dev/null
          ssh-keygen -F "${PROD_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null || {
            printf '::error::PROD_KNOWN_HOSTS does not pin PROD_HOST\n' >&2
            exit 1
          }

      - name: Stream the release to the forced deploy command
        run: |
          artifact="${RUNNER_TEMP}/release/caresync-${GITHUB_SHA}.tar.gz"
          [[ -f "${artifact}" ]]
          artifact_sha256="$(sha256sum "${artifact}" | awk '{print $1}')"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${artifact_sha256}" =~ ^[0-9a-f]{64}$ ]]

          ssh \
            -T \
            -i "${HOME}/.ssh/caresync_deploy" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${PROD_USER}@${PROD_HOST}" \
            "deploy ${GITHUB_SHA} ${artifact_sha256}" \
            < "${artifact}"

      - name: Verify the public production endpoints
        run: |
          health_url="${PRODUCTION_ORIGIN%/}/api/v1/health"
          health_json="$(curl \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --show-error \
            --silent \
            --max-time 15 \
            "${health_url}")"
          python3 - "${health_json}" <<'PY'
          import json
          import sys

          try:
              health = json.loads(sys.argv[1])
          except json.JSONDecodeError as error:
              raise SystemExit(f"production health returned invalid JSON: {error}") from error

          database = health.get("database") or {}
          if not (
              health.get("status") == "ok"
              and database.get("connected") is True
              and database.get("database_name") == "caresync"
          ):
              raise SystemExit("production health did not certify the CareSync database")
          PY

          frontend_html="$(curl \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --show-error \
            --silent \
            --max-time 15 \
            "${PRODUCTION_ORIGIN%/}/")"
          grep -Fq '<div id="root"></div>' <<< "${frontend_html}" || {
            printf '::error::production did not serve the CareSync application shell\n' >&2
            exit 1
          }

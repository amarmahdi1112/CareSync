[project]
name = "caresync-private-backend"
version = "0.1.0"
description = "Private local-first CareSync FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "bcrypt>=4,<6",
    "cryptography>=45,<47",
    "fastapi>=0.120,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.34,<1",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "sqlacodegen>=3,<4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["._*", "**/._*", "app/models/generated_legacy.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
